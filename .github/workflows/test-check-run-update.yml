name: Test Check Run Update (GitHub App)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job 1: This job will "fail" (we simulate a cancelled scenario)
  spot-simulation:
    name: Simulated Spot Job
    runs-on: ubuntu-latest
    steps:
      - name: Simulate some work
        run: |
          echo "Doing some work..."
          sleep 2

      - name: Fail intentionally (simulating spot termination)
        run: |
          echo "Simulating spot termination failure"
          exit 1

  # Job 2: Try to update the failed job's check run using GitHub App
  update-check-run:
    name: Update Failed Check Run (GitHub App)
    runs-on: ubuntu-latest
    needs: spot-simulation
    if: always()
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TEST_APP_ID }}
          private-key: ${{ secrets.TEST_APP_PRIVATE_KEY }}

      - name: List check runs before update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "=== BEFORE UPDATE ==="
          echo "All check runs for this commit:"
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs | jq '.check_runs[] | {id, name, status, conclusion}'

      - name: Update failed check run using GitHub App token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Find the failed job's check run
          CHECK_RUNS=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs)
          
          FAILED_CHECK_ID=$(echo "$CHECK_RUNS" | jq -r '.check_runs[] | select(.name == "Simulated Spot Job") | select(.conclusion == "failure" or .conclusion == "cancelled") | .id')
          
          if [ -z "$FAILED_CHECK_ID" ]; then
            echo "No failed check run found to update"
            exit 1
          fi
          
          echo "Found failed check run ID: $FAILED_CHECK_ID"
          echo "Attempting to update its conclusion to 'neutral' using GitHub App token..."
          
          # Update the check run using GitHub App token
          gh api -X PATCH repos/${{ github.repository }}/check-runs/$FAILED_CHECK_ID \
            -f conclusion="neutral" \
            -f status="completed" \
            -F output[title]="Spot terminated - Rerun passed" \
            -F output[summary]="This job was terminated due to spot instance reclamation. The rerun on on-demand instance passed."
          
          echo ""
          echo "✅ API call completed successfully!"

      - name: Verify update and wait for UI
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "=== AFTER UPDATE ==="
          
          # Verify the update
          CHECK_RUNS=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs)
          echo "All check runs after update:"
          echo "$CHECK_RUNS" | jq '.check_runs[] | {id, name, status, conclusion}'
          
          # Check if update worked
          UPDATED_CONCLUSION=$(echo "$CHECK_RUNS" | jq -r '.check_runs[] | select(.name == "Simulated Spot Job") | .conclusion')
          
          if [ "$UPDATED_CONCLUSION" == "neutral" ]; then
            echo ""
            echo "=============================================="
            echo "✅ SUCCESS: Check run updated to 'neutral'"
            echo "=============================================="
            echo ""
            echo "🔍 NOW CHECK THE PR/ACTIONS PAGE:"
            echo "   The 'Simulated Spot Job' should show as ⚪ (neutral)"
            echo "   instead of ❌ (failure)"
            echo ""
            echo "   Waiting 30 seconds for you to observe the UI..."
            sleep 30
          else
            echo ""
            echo "❌ FAILED: Check run conclusion is '$UPDATED_CONCLUSION'"
            exit 1
          fi

  # Job 3: Final summary
  verify-result:
    name: Verify Final State
    runs-on: ubuntu-latest
    needs: [spot-simulation, update-check-run]
    if: always()
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TEST_APP_ID }}
          private-key: ${{ secrets.TEST_APP_PRIVATE_KEY }}

      - name: Final verification
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "=== FINAL STATE ==="
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs | jq '.check_runs[] | {id, name, status, conclusion}'
          
          echo ""
          echo "=============================================="
          echo "TEST COMPLETE"
          echo "=============================================="
          echo ""
          echo "Expected results:"
          echo "  - 'Simulated Spot Job': neutral (⚪)"
          echo "  - 'Update Failed Check Run (GitHub App)': success (✅)"
          echo "  - 'Verify Final State': success (✅)"
          echo ""
          echo "If 'Simulated Spot Job' shows 'neutral', the GitHub App approach WORKS!"
