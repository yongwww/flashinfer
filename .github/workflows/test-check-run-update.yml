name: Test Workflow Dispatch Architecture

# This workflow tests the proposed architecture:
# 1. PR Gateway creates check runs using GitHub App
# 2. PR Gateway triggers Test Runner via workflow_dispatch
# 3. Test Runner's jobs do NOT appear on PR
# 4. Test Runner updates check runs created by PR Gateway

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Which workflow to run'
        required: true
        default: 'gateway'
        type: choice
        options:
          - gateway
          - runner
      # Inputs for runner mode (passed from gateway)
      sha:
        description: 'Commit SHA (for runner mode)'
        required: false
        type: string
      check_run_id:
        description: 'Check run ID to update (for runner mode)'
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  # ============================================================================
  # GATEWAY MODE: Simulates pr-test.yml behavior
  # ============================================================================
  gateway:
    name: PR Gateway (creates check runs, triggers runner)
    if: inputs.test_mode == 'gateway'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TEST_APP_ID }}
          private-key: ${{ secrets.TEST_APP_PRIVATE_KEY }}

      - name: Create Check Run using GitHub App
        id: create-check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Creating check run 'CI: GPU Tests (Test)' on SHA ${{ github.sha }}..."
          
          RESPONSE=$(gh api repos/${{ github.repository }}/check-runs \
            -f name="CI: GPU Tests (Test)" \
            -f head_sha="${{ github.sha }}" \
            -f status="in_progress" \
            -f output='{"title":"Running tests...","summary":"Tests are in progress on spot instance."}')
          
          CHECK_RUN_ID=$(echo "$RESPONSE" | jq -r '.id')
          echo "Created check run with ID: $CHECK_RUN_ID"
          echo "check_run_id=$CHECK_RUN_ID" >> $GITHUB_OUTPUT
          
          echo ""
          echo "Current check runs on this commit:"
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs | jq '.check_runs[] | {id, name, status, conclusion}'

      - name: Trigger Test Runner workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering test-runner workflow via workflow_dispatch..."
          echo "Passing: sha=${{ github.sha }}, check_run_id=${{ steps.create-check.outputs.check_run_id }}"
          
          gh workflow run test-check-run-update.yml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref }} \
            -f test_mode=runner \
            -f sha=${{ github.sha }} \
            -f check_run_id=${{ steps.create-check.outputs.check_run_id }}
          
          echo ""
          echo "✅ Test Runner workflow triggered!"
          echo ""
          echo "=============================================="
          echo "GATEWAY COMPLETE"
          echo "=============================================="
          echo ""
          echo "What to observe:"
          echo "1. This job (PR Gateway) should show ✅ on PR"
          echo "2. Check run 'CI: GPU Tests (Test)' shows 🔄 in_progress"
          echo "3. A new workflow run will start (Test Runner)"
          echo "4. Test Runner's jobs should NOT appear on this PR/commit"
          echo "5. After Test Runner completes, check run should be ✅"
          echo ""
          echo "Waiting 60 seconds for Test Runner to complete..."
          sleep 60
          
          echo ""
          echo "Final check runs state:"
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs \
            --jq '.check_runs[] | {id, name, status, conclusion}'

  # ============================================================================
  # RUNNER MODE: Simulates test-runner.yml behavior
  # ============================================================================
  runner-spot-simulation:
    name: Simulated Spot Job (will fail)
    if: inputs.test_mode == 'runner'
    runs-on: ubuntu-latest
    steps:
      - name: Simulate running tests
        run: |
          echo "Running tests on spot instance..."
          echo "SHA: ${{ inputs.sha }}"
          echo "Check Run ID to update: ${{ inputs.check_run_id }}"
          sleep 5

      - name: Simulate spot termination
        run: |
          echo "Simulating spot instance termination..."
          exit 1

  runner-rerun:
    name: Simulated Rerun (will succeed and update check)
    if: inputs.test_mode == 'runner' && always()
    needs: runner-spot-simulation
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TEST_APP_ID }}
          private-key: ${{ secrets.TEST_APP_PRIVATE_KEY }}

      - name: Simulate running tests on on-demand
        run: |
          echo "Running tests on on-demand instance..."
          echo "SHA: ${{ inputs.sha }}"
          echo "Check Run ID to update: ${{ inputs.check_run_id }}"
          sleep 3
          echo "Tests passed!"

      - name: Update Check Run to Success
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Updating check run ${{ inputs.check_run_id }} to success..."
          
          gh api -X PATCH repos/${{ github.repository }}/check-runs/${{ inputs.check_run_id }} \
            -f status="completed" \
            -f conclusion="success" \
            -f output='{"title":"Tests Passed (rerun after spot termination)","summary":"Initial spot instance was terminated. Rerun on on-demand instance passed successfully."}'
          
          echo ""
          echo "✅ Check run updated to success!"
          echo ""
          echo "=============================================="
          echo "TEST RUNNER COMPLETE"
          echo "=============================================="
          echo ""
          echo "Verification:"
          echo "1. This workflow (Test Runner) has a ❌ failed job (Simulated Spot Job)"
          echo "2. But this workflow should NOT appear on the original commit/PR"
          echo "3. The check run 'CI: GPU Tests (Test)' should now show ✅"
          echo ""
          echo "Final check runs on commit ${{ inputs.sha }}:"
          gh api repos/${{ github.repository }}/commits/${{ inputs.sha }}/check-runs \
            --jq '.check_runs[] | {id, name, status, conclusion}'
